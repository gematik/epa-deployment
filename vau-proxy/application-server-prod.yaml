server:
  port: 8080
  ssl:
    enabled: false
services:
  information-service:
    routes:
      '[/dummy]': /dummy
  authorization-service:
    routes:
      '[/epa/authz/v1/getNonce]': /epa/authz/v1/getNonce
      '[/epa/authz/v1/send_authorization_request_sc]': /epa/authz/v1/send_authorization_request_sc
      '[/epa/authz/v1/send_authcode_sc]': /epa/authz/v1/send_authcode_sc
  medication-service:
    routes:
      '[/epa/medication/api/v1/fhir/Medication]': /fhir/Medication
      '[/epa/medication/api/v1/fhir/MedicationRequest]': /fhir/MedicationRequest
      '[/epa/medication/api/v1/fhir/MedicationDispense]': /fhir/MedicationDispense
      '[/epa/medication/api/v1/fhir/Organization]': /fhir/Organization
      '[/epa/medication/api/v1/fhir/Practitioner]': /fhir/Practitioner
      '[/epa/medication/api/v1/fhir/PractitionerRole]': /fhir/PractitionerRole
      '[/epa/medication/api/v1/fhir/AuditEvent]': /fhir/AuditEvent
  medication-render-service:
    routes:
      '[/epa/medication/render/v1/eml/xhtml]': /epa/medication/render/v1/eml/xhtml
      '[/epa/medication/render/v1/eml/pdf]': /epa/medication/render/v1/eml/pdf
      '[/epa/medication/api/v1/fhir/\$medication-list]': /epa/medication/api/v1/fhir/$medication-list
  entitlement-service:
    routes:
      '[/epa/basic/api/v1/ps/entitlements]': /epa/basic/api/v1/ps/entitlements
logging:
  level:
    de.gematik.vau.lib: ${LIB_VAU_LOGGING_LEVEL:INFO}
